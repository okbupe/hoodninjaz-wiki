kevin: { group:"Characters", title:"Kevin Young", crumb:"Characters",
chips:[["locked","Canon"],["","13, gold and white"]],
stand:"Thirteen. Swallowed a god by mistake. The only person alive who could survive it.",
body:`
<h2>Why he survived it</h2>
<p><strong>Not luck. Chronology.</strong>[[2]] The Springvale contamination ended 20 years before present day and Kevin is 13, so he was born seven years after the last contaminated bottle was drunk.</p>
<div class="note"><span class="lab">Writing rule</span>
<p><strong>Never write a lucky escape for this.</strong> A coincidence you have to engineer is a weakness; a chronology that simply works is a strength. If anyone asks, he wasn't born.</p></div>
<p><strong>Why that is the protection.</strong> Everyone who drank the water carries a trace of Kūga, and Kūga resonates with his own signature, so every water-generation ninja is already partly Kūga. Had Kevin drunk it, the Sphere would have found a door already open in its own handwriting and poured straight through: consumed in the first second.</p>
<p>He has no trace, no signature, no door. <strong>He is the first host in history who is not already partly the thing inside him.</strong></p>
<p><em>The irony, for much later: Jon, Face and Jaden are the strongest ninjas alive precisely because they drank it, and every one of them would have been consumed instantly. The only person who could survive carrying it is the one who had no power at all.</em></p>

<h2>He is masked by default</h2>
<p><strong>An amplifier at rest emits nothing.</strong> Dormant, Kūga has no nature and therefore no signature. There is genuinely nothing to detect. What can be sensed is never Kūga existing, it is <strong>Kūga doing something</strong>.</p>
<ul>
<li>Kevin is not hiding. There is nothing to find until he uses it.</li>
<li><strong>His power is his beacon.</strong> Every time he reaches for it to save someone, he announces his position.</li>
<li>The strongest thing on earth stays safe only by staying weak.</li>
</ul>
<p>Which is a perfect thirteen-year-old's dilemma: the thing he wants most, to be useful and strong enough to protect people, is the exact thing that gets him found.</p>

${art("Kevin, base look", "Gold and white, deliberately no black. School uniform, North Danim, thirteen and small for the world he is about to be in. A second plate for the corruption state: black with gold highlights, same face, wrong.")}

<h2>The Ultimatum, and why it is mechanical</h2>
<p>Master it by manhood or be consumed. That is not a threat with a poetic deadline. <strong>Kūga can only enter what is not finished yet</strong>, and Kevin's window is closing because Kevin is finishing. When he is fully formed the shape sets, and either he set it or Kūga did.</p>

<h3>See also</h3>
<p><a href="#will">The Power of Will</a> &middot; <a href="#kuga">Kūga</a> &middot; <a href="#springvale">Springvale</a></p>
` },

tribal: { group:"Characters", title:"Tribal", crumb:"Characters",
chips:[["locked","Locked 2026-08-10"],["","40, the Voodoo Master"]],
stand:"Forty. Outside the gods' order entirely. A god wakes up because a man wanted his mother to have loved him.",
body:`
<h2>He is the one thing the system does not cover</h2>
<p>Every power in the series descends from Kega or Kūga. <strong>Tribal's comes from a nineteen-year-old girl in a Danim church who found a book while trying to make a priest want her.</strong></p>
<p>The mythology is six thousand years old and the thing that eventually cracks it is small, human and grubby. That is not a weakness in the design. It is the most Hood Ninjaz idea in the whole canon.</p>
<p>The mechanism is in <a href="#voodoo">Voodoo</a>: every one of his abilities is death-side, and the gods only ever legislated for the living.</p>

<h2>What that buys him</h2>
<ul>
<li><strong>Trace cannot stop him.</strong> He does not beat Trace, he walks past a guard with no authority over him.</li>
<li><strong>Kega has no jurisdiction.</strong> Which is why a god of judgment stops and calmly asks a human how he got here instead of purging him. Tribal is the first being in six thousand years he has no verdict for.</li>
<li><strong>The Book never translates for him</strong>, which is the one that ends the world. See below.</li>
<li><strong>He and Kūga are the only two things outside the order.</strong> Probably why he can see the Elixir scars on the Mandem's souls when nobody else can.</li>
</ul>

<h2>He is the only person who has ever read the Book in its actual language</h2>
<p>The Book translates itself into the reader's own language, but <strong>that translation is a courtesy of the order</strong>, and Tribal is outside it.</p>
<p><strong>So it never translated for him. Not even the forward side.</strong> He had to learn the god-language from scratch just to read the ordinary teaching, which is why he taught himself to read a dead god's handwriting. <strong>And once you can read it raw, the backward side was never hidden from him at all.</strong> There is no forward and backward for Tribal. There is just a book.</p>
<blockquote>He can read the forbidden layer only because he was never granted the easy one.<span class="who">The fourth consequence</span></blockquote>
<p>And the Book's security <strong>assumes a reader inside the order</strong>, because when the gods built it there was no other kind. Sera invented that category 5,960 years later, in a library in Danim, looking for a love spell.</p>

<h3>He reads it and has never heard it</h3>
<p>Reading and hearing are different skills, and he had decades with a text and no teacher: a man who can read Latin and could not hold a conversation in it. Which is why Trace is opaque to him, and why the Season 4 recognition is sharper than a sound-match. <strong>He recognises shapes he has been reading off a page for twenty years, coming out of a mouth for the first time.</strong></p>

<h2>The whispers: he heard the nouns and lost the verbs</h2>
<p>His spirit sight is always on, so <strong>the dead have been talking to him for decades</strong>. But they speak in fragments, and across years he got two words.</p>
<blockquote>God. Ultimate power.<span class="who">The dead, over twenty years</span></blockquote>
<p><strong>They were not tempting him. They were warning him.</strong> He received two words out of a sentence closer to <em>a god is in there, and ultimate power is not what you will find.</em></p>
<div class="note"><span class="lab">And it rhymes with everything else about him</span>
<p><strong>Tribal has spent his entire life receiving incomplete messages from people who will not finish the sentence.</strong> The society who would not say it out loud. His mother, who has never said anything at all. Now the dead, giving him two words out of ten.</p>
<p><strong>Every single time, he has filled the gap in with the same thing: that something is owed to him.</strong> That is why he does it. Not greed. A man completing other people's sentences in his own favour, because nobody has ever finished one for him.</p></div>

<h2>His real motive</h2>
<p>Underneath the mystique he is not chasing a deeper truth in the abstract.</p>
<p><strong>He was taken at birth. His mother is alive, could walk out of that prison any day, and in forty years has never once come for him.</strong></p>
<p>That sits directly on the Power of Will system: <strong>Sera's will is what made him exist, and she has never willed a single thing in his direction since.</strong> Power is the only inheritance she left him, so being worth it is the only route he can see to having been wanted.</p>
<blockquote>A god wakes up because a man wanted his mother to have loved him.
<span class="who">The through-line</span></blockquote>

${art("Tribal", "Forty, a lone operator, one pupil different from the other. His magic should be visibly cold where every other power in the series is hot. Consider a plate of him surrounded by phantoms, and the silence around them.")}

<h2>His abilities, tiered</h2>
<p>The inherited list was everything at once, which quietly made him the answer to every problem.</p>
<div class="tw"><table>
<thead><tr><th>Tier</th><th>What</th><th>Cost</th></tr></thead>
<tbody>
<tr><td><strong>Signature</strong></td><td><strong>Life drain by touch</strong> (inherited from Sera, the exact thing that killed Elliot Jones) and <strong>spirit sight</strong> (the dead, the residue, the scars on souls, Trace as it is)</td><td>Cheap, always on</td></tr>
<tr><td><strong>Costly</strong></td><td><strong>Phantoms.</strong> The dead raised as tethered clones</td><td>Exhausting to hold. An event, never a default</td></tr>
<tr><td><strong>Ritual only</strong></td><td>Soul binding, soul capture, memory planting and distortion (<strong>never restoration</strong>), anything permanent</td><td>Days of preparation, ingredients, <strong>and a sacrifice</strong></td></tr>
</tbody></table></div>
<p><strong>He does not fight. He touches.</strong>[[1]] And spirit sight is why he is a seer rather than a warrior.</p>
<div class="note"><span class="lab">The cost rule, inherited from Sera</span>
<p><strong>Every ritual takes something you love.</strong> Her first one burned a keepsake of her dead mother. Tribal has been giving pieces of himself away for decades, so <strong>what he has left to give is the Season 4 question</strong>, because the ritual that wakes Kega costs him something enormous.</p>
<p>And the line he has never crossed: <strong>Sera drains to keep. Tribal drains to kill.</strong> Same hand. He has never once used it on himself.</p></div>

<h2>The secret society</h2>
<p>They raised him, feared him and studied him. He killed a trainer by accident as a child and they read it as proof rather than warning, and pushed harder.</p>
<p><strong>Then a ritual went wrong in his teens and killed several of them. But they had told him to do it.</strong></p>
<p><strong>They cast him out anyway, because they needed it to be his fault.</strong> If it was his fault they were still in control of something. If it was theirs, they had been playing with a thing they never understood. <strong>So he was exiled for obeying</strong>, and grew up believing he had murdered the only family he had.</p>
<p>He learned the truth in his twenties, and he went back. <strong>Not to kill them. To make one of them say it out loud.</strong> Seventeen years of being called a killer, and he wanted one sentence.</p>
<p>They would not give it to him. <strong>What he did next is the thing he does not talk about.</strong></p>
<p><strong>Present day: functionally gone.</strong> A handful of very old members scattered and hiding, certain the Voodoo Master will come back to finish it. He never has. He got his sentence out of one of them and stopped caring.</p>
<div class="note"><span class="lab">The rhyme</span>
<p><strong>Every adult who was supposed to explain him refused to.</strong> The society. His mother. Both of his defining wounds are him asking to be seen, and being ignored.</p></div>

<h2>He can break. He cannot restore.</h2>
<p>If he can manipulate memory, why not just hand Face his memories back? <strong>Because the Elixir did not erase memories, it erased bonds</strong>, and that is a different layer. He sees the scar perfectly and cannot touch it.</p>
<p>Damage is cheap, repair is impossible. Same asymmetry as Kūga's, which is what makes the world feel like one system.</p>

<h2>Tribal thought he was claiming power</h2>
<p>He is the only person alive who can read that chapter, and <strong>he does not understand what the chapter is</strong>. He sensed something enormous and reached for it, believing he was taking the power for himself.</p>
<p><strong>He was turning a handle.</strong></p>

<h3>Ages, and they hold with nothing to reconcile</h3>
<p>Tribal 40, Face 30, so he was already an adult operator when the Mandem were kids finding the Book. He was 18 to 20 during Springvale, outside the 5 to 15 window entirely, so he is the only major character excluded from Aura <strong>twice over</strong>: wrong age and wrong source.</p>

<h3>See also</h3>
<p><a href="#sera">Sera</a> &middot; <a href="#voodoo">Voodoo</a> &middot; <a href="#trace">Trace</a> &middot; <a href="#book">The Original Book of Ninja</a></p>
` },

sera: { group:"Characters", title:"Sera", crumb:"Characters",
chips:[["locked","Locked 2026-08-10"],["open","Several open"]],
stand:"The Serpent of Danim. Around fifty-nine, looks late twenties, and she is in prison entirely by choice.",
body:`
<h2>Before</h2>
<p><strong>The priest is Elliot Jones.</strong> He is Tribal's father.</p>
<p>Raised by an abusive father after her mother died young. Violence daily, including nights he touched her. She grew up wishing him dead and holding onto the last of herself.</p>
<p>At 19 a school friend, seeing the emptiness in her, pushed her toward a church.</p>

<h2>The priest</h2>
<p>Everything her father was not. Late thirties, handsome, kind, genuinely charismatic. She fixated, and for weeks he stayed kind and completely distant, treating her exactly like everybody else.</p>
<div class="note"><span class="lab">He was the real thing, and that matters</span>
<p>Show him doing something specifically, unshowily good for somebody else, ideally a child, with Sera watching. It is the moment that proves he was not a hypocrite, and it makes what she does to him worse rather than more deserved.</p></div>
<p>Researching how to be wanted, she found books on witchcraft and voodoo in Danim. She dismissed them, then did not. What held her was never love spells. It was <strong>control</strong>.</p>

<h2>The photograph</h2>
<p>She let herself into his office early one Sunday. On the desk, a holiday photo of the priest kissing another man.</p>
<p>The man she had spent months building a future around was never going to want her, and it had nothing to do with anything she could change. Something in her closed.</p>

<h2>The ritual</h2>
<p><strong>The cost.</strong> It required a sacrifice, and she paid with the only clean thing she owned: <strong>a keepsake of her dead mother.</strong> She burned the one good memory she had to buy a man who was never going to want her.</p>
<p>The following Sunday, after the service, in his office. A language he did not recognise. His eyes rolled white and he stood like a puppet.</p>
<p>Then the death. As it ended his eyes cleared, and he understood, and he had time to ask what she had done. Then the second half of the spell took him: the air would not come and his body drained where he stood. Within minutes, a dried husk on the floor.</p>
<div class="note"><span class="lab">On staging it</span>
<p>It is a rape carried out through magical coercion, and it is also the conception of a major character. The Seven Pillars rule works hardest here. <strong>The strongest version cuts away:</strong> the eyes going white, then the husk afterwards. The horror is the power and the consequence, and shooting the middle buys nothing the cutaway does not.</p></div>

<h2>The island, and what her power actually does</h2>
<p><strong>The prison is on a small island, and the island is only the prison.</strong></p>
<p><strong>Tribal has never tried to get her out</strong>, and it is not sentiment, it is common sense: breaking into an island prison is heat he does not need, for a woman who would have walked out decades ago if she wanted to. <strong>He knows she could leave, and has known all his adult life.</strong> Every day she chooses the island over him and he is aware of it.</p>
<div class="note"><span class="lab">Her power inverts the Aura system</span>
<p>Aura is life energy in a living body. Her power eats life energy. <strong>So Aura is not a defence against her, it is a meal</strong>[[1]], and the stronger a ninja is the richer the target. A blazing Tier 4 is the best thing in the room.</p>
<p>Which is why she cannot be on the board casually: the moment she is, every fight the audience has learned to read stops working. <strong>And the accidental counter is beautiful: a dormant person is nearly worthless to her. Kevin is the least nutritious person in Danim City.</strong></p></div>
<p><strong>She is never broken out. She serves the full sentence and walks out of the front gate with paperwork</strong>, having declined or sabotaged parole for decades. The prison was never holding her; the paperwork was a formality she kept refusing. <strong>That is when Tribal finally learns how powerful she truly is.</strong></p>
<p><em>Timing open. Recommendation: Season 4, while everyone is watching Kega, so the most dangerous human alive is released on an ordinary Tuesday and nobody is looking.</em></p>

<h2>She stays by choice</h2>
<p><strong>She could walk out any day and nothing anybody has could stop her.</strong> This is the hinge of the whole character.</p>
<p><strong>On the surface: the prison is a larder.</strong> She drained the priest and never stopped, which is why she has not aged in forty years. A prison is a population that cannot leave and that nobody counts carefully. She is not serving a sentence, she is grazing.</p>
<p><strong>Underneath: the last time she wanted something, she got exactly what she asked for and it destroyed everything.</strong> So she has stopped asking for anything at all. Staying is the one arrangement where she never has to want again.</p>

${art("Sera in the cell", "Late twenties in a fifty-nine-year-old's life. Beautiful in a way that is a tool. The cell should read as chosen, not imposed: too comfortable, too still, and the light in the corridor outside behaving slightly wrong.")}

<h3>The Serpent of Danim</h3>
<p>The reputation is not atmosphere, it is <strong>evidence of her feeding leaving a mark on the building.</strong> Guards avoid her corridor. The cold in it does not match the rest of the wing. Inmates near her get thin and tired and cannot say why. Nobody has ever proved anything.</p>

<h3>Voice</h3>
<p>Sweet, low, seductive by default. <strong>It snaps into screaming anger without warning and then drops straight back</strong>, as if the anger belonged to someone else who has now left. The snap-back is more frightening than the anger.</p>
<p>Damaged, and feared for good reason. Never play her as only one.</p>

<h3>Open</h3>
<ul>
<li><strong>Does Tribal know she could leave?</strong> If he does, his entire life is a response to being un-chosen daily.</li>
<li>Has anyone ever visited her? Sharon, investigating ninja activity, would eventually find the Serpent of Danim.</li>
<li>Which prison, which district. She has no location yet.</li>
<li>Does she know what Tribal became? What, if anything, is she waiting for?</li>
</ul>

<h3>See also</h3>
<p><a href="#tribal">Tribal</a> &middot; <a href="#voodoo">Voodoo</a></p>
` },

uno: { group:"Characters", title:"Uno", crumb:"Characters",
chips:[["locked","Locked 2026-08-10"],["","Late-series reveal"]],
stand:"Bio Genetix's masterpiece is a contamination they did not design, cannot repeat, and will one day want back.",
body:`
<h2>Kane cheated</h2>
<p><strong>Dr Lucius Kane was a Springvale kid himself.</strong> He drank the contaminated school water as a child, it made him what he is, and he spent his career at Bio Genetix watching the company fail over and over to replicate Aura with technology.</p>
<p>So on the one project that was his own, he used the real thing. <strong>His own blood on one side, the last bottle of Springvale on the other, and he infused both.</strong>[[1]] His blood carried the trace, the bottle was the source. The only successful infusion ever performed, and Bio Genetix never knew it happened.</p>

<h2>Why it can never be repeated</h2>
<p>He had one bottle left and he used it. <strong>The input does not exist anywhere on earth any more.</strong> Bio Genetix cannot reproduce Uno no matter what they spend, which makes him irreplaceable and, eventually, hunted.</p>

<h2>And it makes Kane his father</h2>
<p>In the same way Face is Donte's. All three of the 3 Little Ninjaz have a father problem: <strong>one who does not know him, one who made him, and one who is really a brother.</strong></p>

<div class="note"><span class="lab">How it gets delivered</span>
<p>Uno does not remember, because the EMP took it. So he learns it in the room at the same time as everyone else. <strong>Give the fact to somebody else and the line to Uno.</strong> Heavy moment, silence after the reveal, and Uno is the one who breaks it trying to make it lighter, in the shape of <em>"so I have got a man's blood running through my circuits."</em></p>
<p>It should land as the saddest thing in the episode rather than a joke. Find the exact wording in the scene; do not pre-bake it.</p></div>

${art("Uno", "Green and white. Reads as thirteen, engineered to. The tell is that he is the only one of the three whose body was a decision. A second plate for the river: the boat, days adrift, systems rebooting with nothing left in them.")}

<h3>See also</h3>
<p><a href="#springvale">Springvale</a> &middot; <a href="#lineage">The Lineage Model</a></p>
` },

rules: { group:"Reference", title:"The Writing Rules", crumb:"Reference",
chips:[["locked","Absolute"]],
stand:"The ones that bite most often. Break any of these and something downstream breaks with it.",
body:`
<h2>Voice</h2>
<ul>
<li><strong>No em dashes.</strong> Anywhere, ever, workspace-wide. An en dash is not a substitute.</li>
<li><strong>Never describe voodoo with Aura's vocabulary.</strong> Cold, void, silence.</li>
<li><strong>Archer performs; Kūga endures.</strong> Amused versus bored, long sentences versus short flat ones.</li>
</ul>

<h2>Canon</h2>
<ul>
<li><strong>The Kegare layer is never explained in-series.</strong> Creator's Easter egg only. No draft ever helpfully unpacks it.</li>
<li><strong>Never write a lucky escape for Kevin missing the water.</strong> He was not born. That is enough.</li>
<li><strong>Every Kūga joke is a live will-test.</strong> He is never only joking.</li>
<li><strong>Never state a number for Kūga's power.</strong> Show someone try to and fail.</li>
</ul>

<h2>Artifacts</h2>
<ul>
<li><strong>Markdown only.</strong> Every episode ships three files: the script (canonical), the Book edition, the Reading Edition. No Doc, no docx, no PDF.</li>
<li><strong>Staging is never invented in the Reading Edition.</strong> It goes into the script first and propagates down, because the script wins on any conflict.</li>
<li><strong>New lore gets drafted in the Book's voice, as a page</strong>, because the Book is to exist in real life.</li>
</ul>

<h2>The extremity calibration</h2>
<p><strong>Taking extremity right to the edge is a Hood Ninjaz signature, not a risk to be managed.</strong>[[2]] This is the house setting for every episode.</p>
<ul>
<li><strong>Sex:</strong> toward <strong>softcore</strong>, never hardcore, never explicit. The edge is where it lives.</li>
<li><strong>Violence:</strong> <strong>you feel every violent act.</strong> Not a bloody gore mess, explicitly not Chainsaw Man. It sits between <strong>Attack on Titan and Mortal Kombat</strong>: weight, consequence and impact, not spectacle-splatter.</li>
</ul>
<div class="note"><span class="lab">How this reads against the Seven Pillars</span>
<p>The pillar bans gore and sex <strong>for shock value alone</strong>, which is not the same as banning intensity. Intensity with purpose is the brand. <strong>The test is never "is this too much", it is "is this doing work".</strong> A scene that earns its extremity keeps it.</p></div>

<h2>Audience</h2>
<ul>
<li><strong>Trust their intelligence.</strong> Never pander.</li>
<li><strong>Never explain the football.</strong> Trace plays football and there is no reason. That is the point.</li>
</ul>
` },

open: { group:"Reference", title:"Open Questions", crumb:"Reference",
chips:[["open","Live at 2026-08-10"]],
stand:"Everything currently undecided, in rough order of how much it blocks.",
body:`
<h2>Blocking</h2>
<ul>
<li><strong>Trace.</strong> Everything except his origin. Parked as a whole separate conversation, and he sits between Tribal and the Book.</li>
<li><strong>Episodes 3 to 10</strong> are not outlined.</li>
<li><strong>The production engine call</strong> (ComfyUI versus Higgsfield) is still gate 0 and nothing downloads until it is made.</li>
</ul>

<h2>Character</h2>
<ul>
<li><strong>Does Tribal know Sera is alive and could leave?</strong> The second half of that question is his whole character.</li>
<li><strong>Which prison, which district</strong> for Sera. Everything else in the series is grounded geographically.</li>
<li><strong>Which two or three abilities are truly Tribal's</strong> versus rare ritual-only feats. His current list is very broad and risks making him the answer to every problem.</li>
<li><strong>The secret society</strong> that raised Tribal has no present-day status and does not appear in the Organisations section.</li>
<li><strong>The priest needs a name.</strong> He is Tribal's father.</li>
</ul>

<h2>Lore</h2>
<ul>
<li><strong>What exactly is left behind</strong> at the Severing site, in physical terms.</li>
<li><strong>Which eras get episodes</strong> in the KUGA spin-off. The two thousand years are deliberately unmapped.</li>
<li><strong>Whether the village man's kindness is ever shown to Kūga again</strong>, or stays buried until the main series pays it off. Recommendation: the latter.</li>
</ul>
` },

kugaspin: { group:"Reference", title:"KUGA (spin-off)", crumb:"Reference",
chips:[["","Note, not a commission"]],
stand:"Two thousand years. One being with no self, passed through the worst centuries humans have.",
body:`
<div class="note"><span class="lab">Status</span>
<p><strong>A note, not a commission.</strong> Nothing is outlined, nothing is scheduled, and it sits behind the main series and the production pipeline. It exists so the material is not lost and so the main series stops accidentally contradicting it.</p></div>

<h2>The pitch</h2>
<p>Kūga wakes with no nature, no judgment, no memory and no place, because the god he was cut out of removed him from the order rather than killing him. He becomes what he is exposed to and amplifies it. <strong>The series is the record of what he was exposed to.</strong></p>
<p>It runs from the Severing to the Second Seal, and it ends where the main series' mythology begins: ten gods dying to put him in a crystal.</p>

<h2>Why it can carry its own show</h2>
<p><strong>The growth curve is flat then vertical.</strong> Tetration is almost nothing for a very long time, so for centuries he is a nobody being passed from hand to hand, and the horror is that <strong>nothing appears to be happening</strong>. There is no power-creep problem: the maths does the escalation.</p>
<p><strong>He is not the protagonist in the usual sense.</strong> He is the thing history happens to. Each era gives a new cast around a constant, which can run indefinitely without the lead needing an arc every season.</p>
<p><strong>His two thousand free years cover the entire rise of human civilisation.</strong> He did not watch it. He was passed through it.</p>

<h2>Tone</h2>
<p>Heavy. Starting him in a slave chain is the strongest engine available and puts the spin-off in the same thematic room as the main series rather than off to the side. The Seven Pillars apply.</p>
<p><strong>The village man should be the smallest part and the most important thing in the show.</strong> No name, no arc, no return. He is why the ending of Hood Ninjaz works.</p>

<h3>See also</h3>
<p><a href="#severing">The Severing</a> &middot; <a href="#timeline">The Timeline</a></p>
` },

function autolink(container, currentKey){
  const done = new Set([currentKey]);
  const SKIP = new Set(["A","H1","H2","H3","H4","CODE","PRE","TH","SUP"]);
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      let el = n.parentElement;
      while(el && el !== container){
        if(SKIP.has(el.tagName)) return NodeFilter.FILTER_REJECT;
        if(el.classList && (el.classList.contains("chips") || el.classList.contains("art")
           || el.classList.contains("infobox") || el.classList.contains("refs"))) return NodeFilter.FILTER_REJECT;
        el = el.parentElement;
      }
      return n.nodeValue && n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const queue = [];
  let n; while((n = walker.nextNode())) queue.push(n);
  while(queue.length){
    const node = queue.shift();
    if(!node.parentNode) continue;
    let best = null;
    for(const [key, re] of TERMS){
      if(done.has(key) || !PAGES[key]) continue;
      const m = node.nodeValue.match(re);
      if(m && (best === null || m.index < best.m.index)) best = {key, m};
    }
    if(!best) continue;
    const {key, m} = best;
    const after = node.splitText(m.index);
    after.nodeValue = after.nodeValue.slice(m[0].length);
    const a = document.createElement("a");
    a.className = "wl";
    a.href = "#" + key;
    a.textContent = m[0];
    a.title = PAGES[key].stand || PAGES[key].title.replace(/<[^>]+>/g,"");
    node.parentNode.insertBefore(a, after);
    done.add(key);
    queue.unshift(after);
  }
}

    box.r.map(([k,v]) => '<div class="row"><dt>'+k+'</dt><dd>'+v+'</dd></div>').join("") +
    '</dl></aside>';

function refsHTML(key){
  const list = REFS[key];
  if(!list || !list.length) return "";
  return '<h2>References</h2><ol class="refs">' +
    list.map((r,i) => '<li id="ref-'+key+'-'+(i+1)+'">'+r+'</li>').join("") + '</ol>';
}

function citations(html, key){
  return html.replace(/\[\[(\d+)\]\]/g, (_, n) =>
    '<sup class="cite"><a href="#ref-'+key+'-'+n+'">['+n+']</a></sup>');
}
