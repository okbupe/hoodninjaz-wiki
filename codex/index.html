<style>
  :root{
    --ground:#0B0E14; --surface:#141922; --surface-2:#1B212C; --line:#2A3240;
    --ink:#E6E3DC; --muted:#8B93A3; --gold:#C9A227; --gold-dim:#8A6F1C;
    --pale:#B8BEC9; --shadow:rgba(0,0,0,.5);
    --display:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --ground:#F2F0EA; --surface:#FFFFFF; --surface-2:#E9E6DE; --line:#D6D1C4;
      --ink:#191C23; --muted:#5C6270; --gold:#8A6B12; --gold-dim:#B8942A;
      --pale:#454D5C; --shadow:rgba(60,55,40,.14);
    }
  }
  :root[data-theme="light"]{
    --ground:#F2F0EA; --surface:#FFFFFF; --surface-2:#E9E6DE; --line:#D6D1C4;
    --ink:#191C23; --muted:#5C6270; --gold:#8A6B12; --gold-dim:#B8942A;
    --pale:#454D5C; --shadow:rgba(60,55,40,.14);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{animation-duration:.001ms!important; transition-duration:.001ms!important}
  }

  .shell{display:grid; grid-template-columns:290px minmax(0,1fr); min-height:100vh}

  /* ---------- sidebar ---------- */
  .side{
    background:var(--surface); border-right:1px solid var(--line);
    padding:26px 0 60px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{padding:0 24px 20px; border-bottom:1px solid var(--line); margin-bottom:18px}
  .brand h1{
    font-family:var(--display); font-size:25px; line-height:1.1; margin:0 0 6px;
    letter-spacing:-.01em; text-wrap:balance;
  }
  .brand .sub{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); margin:0;
  }
  .navgroup{padding:0 14px; margin-bottom:20px}
  .navgroup > h2{
    font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin:0 0 8px; padding:0 10px;
  }
  .navgroup a{
    display:block; padding:6px 10px; border-radius:3px; color:var(--ink);
    text-decoration:none; font-size:14.5px; border-left:2px solid transparent;
    transition:background .15s, border-color .15s, color .15s;
  }
  .navgroup a:hover{background:var(--surface-2)}
  .navgroup a:focus-visible{outline:2px solid var(--gold); outline-offset:1px}
  .navgroup a.on{border-left-color:var(--gold); color:var(--gold); background:var(--surface-2)}

  /* ---------- main ---------- */
  .main{padding:44px 48px 120px; max-width:860px}
  .crumb{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase;
    color:var(--muted); margin:0 0 12px;
  }
  h1.page{
    font-family:var(--display); font-size:clamp(32px,4.6vw,46px); line-height:1.08;
    margin:0 0 6px; letter-spacing:-.015em; text-wrap:balance;
  }
  .kanji{color:var(--gold); font-weight:400}
  .standfirst{
    font-size:18px; color:var(--pale); margin:0 0 26px; max-width:62ch;
    font-family:var(--display); font-style:italic; line-height:1.5;
  }
  .main h2{
    font-family:var(--display); font-size:25px; line-height:1.2; margin:44px 0 12px;
    letter-spacing:-.01em; text-wrap:balance;
    padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .main h3{font-size:16px; margin:28px 0 8px; letter-spacing:.005em}
  .main p{margin:0 0 15px; max-width:66ch}
  .main ul,.main ol{margin:0 0 15px; padding-left:22px; max-width:66ch}
  .main li{margin-bottom:7px}
  .main strong{color:var(--ink); font-weight:650}
  .main em{color:var(--pale)}
  .main a{color:var(--gold); text-decoration:underline; text-underline-offset:2px}
  .main a:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  /* ---------- status chips ---------- */
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 24px}
  .chip{
    font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
    padding:4px 9px; border-radius:2px; border:1px solid var(--line); color:var(--muted);
  }
  .chip.locked{border-color:var(--gold-dim); color:var(--gold)}
  .chip.open{border-color:var(--pale); color:var(--pale)}
  .chip.parked{border-style:dashed}

  /* ---------- pull quote ---------- */
  blockquote{
    margin:24px 0; padding:16px 22px; border-left:2px solid var(--gold);
    background:var(--surface); font-family:var(--display); font-size:19px;
    line-height:1.45; color:var(--ink); max-width:60ch;
  }
  blockquote .who{
    display:block; margin-top:9px; font-family:var(--mono); font-size:10px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-style:normal;
  }

  /* ---------- record vs truth ---------- */
  .rvt{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);
       border:1px solid var(--line); margin:24px 0}
  .rvt > div{background:var(--surface); padding:18px 20px}
  .rvt h4{
    font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    margin:0 0 10px; color:var(--muted);
  }
  .rvt .t h4{color:var(--gold)}
  .rvt p{font-size:14.5px; margin:0 0 10px}
  .rvt p:last-child{margin-bottom:0}

  /* ---------- callout ---------- */
  .note{
    border:1px solid var(--line); border-left:2px solid var(--gold);
    background:var(--surface); padding:16px 20px; margin:22px 0; max-width:66ch;
  }
  .note .lab{
    font-family:var(--mono); font-size:10px; letter-spacing:.15em; text-transform:uppercase;
    color:var(--gold); display:block; margin-bottom:7px;
  }
  .note p:last-child{margin-bottom:0}

  /* ---------- image placeholder ---------- */
  .art{
    border:1px dashed var(--gold-dim); background:var(--surface);
    padding:26px 22px; margin:26px 0; text-align:left; max-width:66ch;
  }
  .art .tag{
    font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--gold); display:block; margin-bottom:9px;
  }
  .art .what{font-family:var(--display); font-size:18px; margin:0 0 8px; color:var(--ink)}
  .art .desc{font-size:14px; color:var(--muted); margin:0; max-width:58ch}

  /* ---------- tables ---------- */
  .tw{overflow-x:auto; margin:22px 0; border:1px solid var(--line)}
  table{border-collapse:collapse; width:100%; min-width:480px; font-size:14.5px}
  th,td{padding:11px 15px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
  th{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); background:var(--surface); font-weight:400;
  }
  tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--gold)}

  /* ---------- header bar (mobile) ---------- */
  .bar{display:none}
  .burger{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    padding:9px 14px; border-radius:3px; cursor:pointer;
  }
  .burger:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  @media (max-width:900px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .bar{
      display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:20;
      padding:12px 18px; background:var(--ground); border-bottom:1px solid var(--line);
    }
    .bar .t{font-family:var(--display); font-size:17px}
    .side{
      position:fixed; inset:0 auto 0 0; width:min(300px,86vw); z-index:30;
      transform:translateX(-102%); transition:transform .22s ease; box-shadow:0 0 40px var(--shadow);
      height:100vh;
    }
    .side.open{transform:none}
    .scrim{
      position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:25; display:none;
    }
    .scrim.on{display:block}
    .main{padding:26px 20px 100px}
    .rvt{grid-template-columns:1fr}
  }

  /* ---------- overflow containment (fixes horizontal scroll) ---------- */
  html,body{max-width:100%}
  body{overflow-wrap:break-word}
  .shell{min-width:0}
  .main{min-width:0; max-width:100%}
  .main p,.main ul,.main ol{max-width:min(66ch,100%)}
  .standfirst{max-width:min(62ch,100%)}
  .note,.art{max-width:min(66ch,100%)}
  blockquote{max-width:min(60ch,100%)}
  .tw{max-width:100%}
  img{max-width:100%; height:auto}
  @media (max-width:640px){
    table{min-width:0}
    th,td{padding:9px 11px; font-size:13.5px}
  }

  /* ---------- wikilinks: first mention only, quiet until hover ---------- */
  a.wl{color:var(--gold); text-decoration:none; border-bottom:1px solid transparent}
  a.wl:hover{border-bottom-color:var(--gold)}
  a.wl:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  /* ---------- citations ---------- */
  sup.cite{font-size:.68em; line-height:0; vertical-align:super; margin-left:1px}
  sup.cite a{color:var(--gold); text-decoration:none; font-family:var(--mono)}
  sup.cite a:hover{text-decoration:underline}
  .refs{margin-top:14px; padding-left:0; list-style:none; counter-reset:r}
  .refs li{
    counter-increment:r; position:relative; padding-left:30px; margin-bottom:9px;
    font-size:14px; color:var(--muted); max-width:min(66ch,100%);
  }
  .refs li::before{
    content:counter(r) "."; position:absolute; left:0; top:0;
    font-family:var(--mono); font-size:11px; color:var(--gold); padding-top:3px;
  }
  .refs code{font-family:var(--mono); font-size:12.5px; color:var(--pale)}
  .refs li:target{color:var(--ink)}

  /* ---------- infobox ---------- */
  .infobox{
    float:right; width:272px; margin:4px 0 22px 30px;
    border:1px solid var(--line); background:var(--surface); font-size:13.5px;

    .infobox{float:none; width:100%; margin:0 0 24px}

  /* ---------- portal home ---------- */
  .hero{border:1px solid var(--line); background:var(--surface); padding:28px 30px; margin:0 0 26px}
  .hero h2{margin:0 0 10px; border:0; padding:0; font-size:27px}
  .hero p{font-size:16.5px; color:var(--pale); margin:0 0 4px}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px;
         background:var(--line); border:1px solid var(--line); margin:0 0 30px}
  .stat{background:var(--surface); padding:15px 16px}
  .stat b{display:block; font-family:var(--display); font-size:26px; color:var(--gold);
          line-height:1; font-variant-numeric:tabular-nums}
  .stat span{display:block; margin-top:6px; font-family:var(--mono); font-size:9.5px;

  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin:0 0 30px}
  .tile{border:1px solid var(--line); background:var(--surface); text-decoration:none!important;
        color:var(--ink); display:flex; flex-direction:column; transition:border-color .15s}
  .tile:hover{border-color:var(--gold)}
  .tile:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .tile .slot{border-bottom:1px dashed var(--gold-dim); background:var(--surface-2);

  .tile .cap i{font-style:normal; font-size:13px; color:var(--muted)}

  /* ---------- signature quote ---------- */
  .lead-quote{border-top:1px solid var(--line); border-bottom:1px solid var(--line);
              padding:18px 0 16px; margin:0 0 26px; max-width:min(60ch,100%)}
  .lead-quote p{font-family:var(--display); font-size:21px; line-height:1.4; font-style:italic;

  .lead-quote cite{font-family:var(--mono); font-size:10px; letter-spacing:.14em;

  /* ---------- portrait in infobox ---------- */
  .infobox .portrait{border-bottom:1px solid var(--line); background:var(--surface-2);

                     padding:16px; border-top:1px dashed var(--gold-dim)}
  .infobox .portrait span{font-family:var(--mono); font-size:9px; letter-spacing:.13em;
                          text-transform:uppercase; color:var(--gold); text-align:center; line-height:1.7}

  /* ---------- navbox ---------- */
  .navbox{border:1px solid var(--line); margin:40px 0 0; background:var(--surface)}
  .navbox summary{padding:11px 16px; cursor:pointer; font-family:var(--mono); font-size:10px;

  .navbox[open] summary::after{content:" [ hide ]"}
  .navbox summary:focus-visible{outline:2px solid var(--gold); outline-offset:-2px}
  .navbox .grp{display:grid; grid-template-columns:120px minmax(0,1fr); gap:12px;

  .navbox .grp b{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;

  .navbox .grp div{min-width:0}
  .navbox a{color:var(--gold); text-decoration:none; border-bottom:1px solid transparent}
  .navbox a:hover{border-bottom-color:var(--gold)}
  .navbox .here{color:var(--muted); border:0}
  @media (max-width:560px){ .navbox .grp{grid-template-columns:1fr; gap:5px} }

          border:1px solid var(--line); padding:3px 9px; border-radius:2px}

</style>

body:`
<div class="hero">
<h2>Welcome to the Danim Codex</h2>
<p>The canon wiki for <strong>Hood Ninjaz</strong>: six thousand years of mythology sitting underneath a barbershop in North Danim.</p>
<p>Twenty entries, cross-linked. The written source of truth is the Series Bible and the character profiles in the repo; this exists so you can find any of it in two taps.</p>

<h2>Featured: the spine of the whole thing</h2>
<div class="note"><span class="lab">Why the ending works</span>

body:`
<h2>The name</h2>
<p><strong>穢我 means the defiled self.</strong>[[1]] 穢 is the defilement character taken from <em>kegare</em>; 我 is self, I, ego. It is pronounced KEH-gah, and it sounds identical to the everyday Japanese word for <strong>injury</strong> (怪我), the word a kid uses for a scraped knee.</p>
<p>Those kanji are ateji, chosen for sound rather than meaning, and the two they happen to be are 怪 (uncanny, the character that opens <em>yōkai</em>) and 我 (self). So the ordinary word for a wound is written, by pure historical accident, as <strong>the uncanny I</strong>.</p>
<p>The Book writes 穢我. Said aloud in Danim, nobody hears the difference. Jon can read the character on a page and go quiet while a kid three feet away thinks someone got hurt.</p>

<div class="note"><span class="lab">Absolute writing rule</span>
<p><strong>The Kegare layer is never explained in-series.</strong> It is a creator's Easter egg. Surface reading is the wound. Anyone who researches it finds <em>kegare</em>, the Shinto term for pollution and defilement, and works out for themselves that the list of violations waking him is not a list of crimes but a list of defilements. No draft ever helpfully unpacks this.</p></div>

<h2>Why the name is the tragedy</h2>
<p>He amputated himself to stop being defiled. He is named for defilement.</p>
<p><em>Kegare</em> is not moral sin. It is accumulated heaviness, contamination that builds whether or not anyone did anything wrong, which is a precise description of what happened to his judgement. He cut away his ability to change in order to escape it, and the cutting is what defiled him permanently.</p>

<h2>What he is now</h2>
<p><strong>Kega is the verdict.</strong>[[1]] The faculty that weighs what is broken and decides what happens to it. Fixed, absolute, unmovable. He sets the law.</p>
<p>Judgment with no adaptability is <strong>unpersuadable</strong>. He cannot be argued with, updated or proven wrong, because the organ that did that is gone. When the bible says he sees no heroes and villains, that is not a philosophy. It is a missing limb.</p>
<p>He does not come to reclaim his other half. You do not reattach the limb you amputated on purpose. <strong>He is coming to finish the operation.</strong></p>

<h2>He was right</h2>
<p>As the ten sealed him he said, quietly, <em>"You don't know what you have done."</em>[[2]]</p>
<p>It came true within months. Removing the foundation collapsed the order, and the collapse is what let Kūga rise. Sealing Kega directly caused the thing that killed all ten of them.</p>
<p><strong>He is not evil and he is not wrong.</strong> He is a god who was proved correct by history and has spent 5,500 years in a book being right. That is a much harder final boss than a monster.</p>

${art("Kega, full figure", "Not a demon and not a warrior. Something that reads as a judge: still, frontal, symmetrical, no weapon drawn. The absence of any wound where the severing happened is the point. Should feel older than every other design in the series.")}

<h2>He does not read minds</h2>
<p><strong>Hard rule, and it protects the whole series.</strong>[[2]] A god who reads minds ends most scenes before they start. <strong>Kega has no access to anyone's thoughts, ever.</strong></p>
<p>What he has is <strong>speed of acquisition</strong>: a language in about a minute, purely by hearing it spoken. He learns like a genius observing, never like a telepath, which also means <strong>he can be wrong, confused and out of date</strong>, and he is all three when he arrives.</p>

<h2>The arrival</h2>
<p>He speaks first, calmly, in the language of the gods, with no reason to think he will not be understood. Tribal understands nothing, is frantically trying to place where he has heard it, and says nothing.</p>
<p><strong>Kega lifts a hand and charges a strike, visibly frustrated.</strong> First time in six thousand years anyone has failed to answer him.</p>
<p>Then <strong>Tribal says it out loud: "I don't understand you."</strong> That is the hinge of the scene and the only reason he survives it.</p>
<div class="note"><span class="lab">The POV switch</span>
<p>We go inside Kega's head, and what is in there is not omniscience. <em>What is this language. What era is this. Why is he dressed like that. How was I brought back.</em> Underneath his thoughts, <strong>Tribal is still babbling in the background, and that is the corpus.</strong> Tribal talks to stay alive, and the talking hands over the language. No mind-reading, and the irony is entirely his own doing.</p></div>
<p>Kega decides he needs the language and starts analysing Tribal. <strong>Over about thirty seconds his speech merges out of the god-language and into English.</strong> No glow, no effect, nothing impressive to him. He simply starts speaking English, and that is what makes it terrifying.</p>
<p>The same calm question, now in English. Tribal understands it, has to answer, and cannot. The arm goes up. Mid-strike, at the corner of his eye: Kūga.</p>
<p><strong>The sting: Tribal is alive by accident.</strong> Kega did not spare him. He found something more important mid-swing.</p>

<h2>He arrives unaware</h2>
<p>He is not hunting. Tribal's ritual pulled him blind, and he never knew Kūga survived as a thing at all: he was excising a faculty, not creating a being. In his mind it was cut out and gone, the way you burn a diseased limb.</p>
<p>So the moment he senses Kūga is a discovery, not a reunion, and the discovery is worse. <strong>That is mine. And it has been alive this whole time.</strong></p>

<h3>See also</h3>
<p><a href="#severing">The Severing</a> &middot; <a href="#kuga">Kūga</a> &middot; <a href="#seals">The Two Seals</a> &middot; <a href="#book">The Original Book of Ninja</a></p>
` },

kuga: { group:"The Mythology", title:'Kūga <span class="kanji">空我</span>', crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"],["","Name revealed S1E06"]],
stand:"The empty self. Not destruction. An amplifier, and currently sealed inside a thirteen-year-old.",
body:`
<h2>Hakai is a misnomer</h2>
<p>破壊 (<em>hakai</em>) is ordinary modern Japanese for destruction. The name was bestowed at the sealing by ten frightened beings describing the only behaviour they had ever seen from it. <strong>They were describing a symptom and mistaking it for a species.</strong></p>
<p>The name stays in every script and is simply, canonically, wrong. His real name is 空我, KŪGA, <strong>the empty self</strong>: 空 is Buddhist emptiness, the doctrine that nothing has inherent self-nature and everything takes its form from conditions.</p>

<div class="note"><span class="lab">Worth knowing</span>
<p>破戒 is also read <em>hakai</em> and means the breaking of a religious vow. Ten warriors from rival clans broke generations of sworn enmity to seal him, then took their own lives. The second reading sits on top of the story for free and is never explained.</p></div>

<h2>His power is an operator, not a value</h2>
<p><strong>He has no nature and no power of his own. He takes whatever he is exposed to and raises it.</strong>[[1]] That is why he looked like destruction for two thousand years: destruction is what he was fed.</p>
<p>This is why the answer was never "chaos". Chaos is another value on the same shelf as destruction. An operator is a different category, and it is what "prior in origin" had to mean.</p>

<h3>Scale: tetration</h3>
<p>Addition, multiplication, exponentiation, then <strong>tetration</strong>, each the repetition of the one before. Tetration is iterated exponentiation and it produces numbers that cannot be written down.[[2]] 3↑↑4 has roughly 3.6 trillion digits. There is not enough matter to print it on.</p>
<div class="note"><span class="lab">How the series conveys this</span>
<p><strong>Never state the number.</strong> The number genuinely cannot be expressed, and that is more frightening than a blank. Show someone try and fail: when Bio Genetix finally get a reading, the problem is not that the meter maxes out, it is that <strong>their notation cannot hold it</strong>.</p>
<p>And the audience's ruler is already on screen. Everything they have loved for three seasons, Face's black smoke, Jon's blue, Jaden's gold, was made by <strong>diluted runoff</strong>.</p></div>

<h2>What he looks like</h2>
<p>The Hakai form, future-Kevin in black with void eyes, is what he was <em>wearing</em>, because Kevin was the input. When the true name surfaces he stops wearing Kevin.</p>
<p><strong>His own form is colourless.</strong>[[3]] Not white, not black. Something the eye cannot fix on, the way you cannot focus on a shape in peripheral vision. And when he amplifies, <strong>he takes the colour of whatever he is amplifying</strong>, so his appearance is a live readout of Kevin's inner state. The audience learns to read the boy off the god.</p>

${art("Kūga, the reveal", "The moment he stops wearing Kevin. Colourless, unfixable, the eye sliding off him. Needs to be legible as a figure while refusing to settle into one. Pair with a second plate showing him taking on a colour mid-amplification.")}

<h2>Voice</h2>
<p>Refined, cold, precise English. The evil-genius register, against a Danim backdrop.</p>
<div class="note"><span class="lab">Craft flag</span>
<p><strong>Archer is already a refined English voice.</strong> Two of them will blur in audio, so they are separated mechanically: <strong>Archer performs</strong> (amused, has an audience, long sentences, "do try to keep up"). <strong>Kūga endures</strong> (bored rather than amused, one listener he despises, short flat sentences, never explains anything twice).</p></div>
<p>Kevin teaches him slang. He deploys it correctly at horrifying moments, so the joke is register collision rather than error. He finds pure hood talk tedious and would rather Kevin killed the person than kept talking like that. It genuinely frustrates him that a god is reduced to this.</p>

<h2>His grievance</h2>
<p><strong>Kega did not even finish the job.</strong> Destruction would have been mercy. What he got was being discarded while still conscious, into a world of men, with nothing. Cast out like a wild dog. Scraped off like something on the tip of a boot.</p>
<p><em>"You made me this. Not the world. You put me in the world."</em></p>
<p>He feels the connection to Kega, and it explains nothing and comforts nothing. It sits there being true, like being related to someone you despise.</p>
<blockquote>The first seal was done by beings who thought they knew better. The second by the same beings, once they had learned they did not. The irony is absolute poetry.
<span class="who">Kūga</span></blockquote>

<div class="note"><span class="lab">Performance note</span>
<p><strong>Calculatedly irritated, never emotional.</strong> He gets more precise when he is angry, not louder. The register never rises. Anger shows as exactness, so the scene most performers would play big gets played cold.</p></div>

<h3>See also</h3>
<p><a href="#will">The Power of Will</a> &middot; <a href="#severing">The Severing</a> &middot; <a href="#kevin">Kevin Young</a> &middot; <a href="#timeline">The Timeline</a></p>
` },

severing: { group:"The Mythology", title:"The Severing", crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"],["open","One open question"]],
stand:"Six thousand years ago a god passed a verdict on himself, and something began gathering in the empty air behind him.",
body:`
<h2>Why</h2>
<p>For a long time Kega set law and knew exactly why each law existed. Then experience accumulated, and the accumulation <strong>clouded him</strong>. The laws began contradicting each other and going against the orders of life. He traced the fault to its source: the half of himself that takes in the world.</p>

<h2>How, and why it took years</h2>
<p><strong>His only tool is the verdict, and a verdict requires the whole self:</strong>[[1]] judgment to pass sentence, and the thing sentenced ruled broken. For years he tried every way around it and failed.</p>
<p>What finally worked was the one thing he had never been able to do. <strong>He ruled himself the defect.</strong> The day he genuinely believed he was the broken thing was the day it became possible. It cost enormous power and left him weak for months.</p>
<p><strong>So the last honest verdict he ever passed was against himself.</strong> Every judgement since has come from something with no way to check its own work.</p>

<div class="note"><span class="lab">Purging is not killing</span>
<p>It is <strong>removal from the order</strong>. The severed half was not destroyed, it was cast out, which is why it survived with nothing: no nature, no judgment, no place. It is also why Kūga sits outside the order entirely, and why the sacred balance has no grip on him.</p></div>

<h2>What it looks like</h2>
<p><strong>No cut. No wound. No blood.</strong> He passes the verdict and part of him simply stops being included. It falls out of him the way a name falls off a list.</p>

<h2>What is left behind</h2>
<p>Abstract. A presence, not a body.</p>
<p>Kega finishes and leaves. The camera stays. <strong>In the empty air where it happened, something begins to gather.</strong> Not a figure, not a shape. A presence starting to come together.</p>
<p><strong>We never see it materialise.</strong> The scene ends before it becomes anything. He has no form yet because he has no nature yet, and form is only acquired from exposure. By the time the villager finds him in the bushes he has taken shape, and the audience is left to understand that the gap between those two moments is where a body came from.</p>
<p><em>Do not explain the gap. Do not show the transition. The cut is the point.</em></p>

${art("The gathering", "The empty clearing after Kega leaves. Nothing to see except that the air is wrong in one place. The hardest image in the series to get right, because the whole beat depends on it never resolving into a figure.")}

<h2>His first two experiences</h2>
<p>In order, and this is the entire explanation of what he became.</p>
<ol>
<li><strong>A village man finds a naked frail man lying in the bushes</strong> and, for no reason at all, helps him up, bathes him, clothes him and takes him in.</li>
<li><strong>The village is attacked.</strong> People are taken as slaves. Frail, weak Kūga is one of them.</li>
</ol>
<p>He has no nature. He becomes what he is exposed to. <strong>The kindness lasted days. The violence lasted centuries.</strong>[[2]]</p>

<div class="note"><span class="lab">The load-bearing consequence</span>
<p>The first thing that ever happened to Kūga was a stranger being good to him for nothing. It is the oldest thing in him, buried under two thousand years of the other and four thousand years of the seal.</p>
<p>So when a barbershop, a mother, a grandad and three kids from North Danim get amplified in Season 3, <strong>that is not a new input. It is the first one.</strong> He met it once, and it was too brief to take.</p></div>

<h3>Open</h3>
<p>What exactly is left behind at the site, in physical terms, if anything. Named as open for the spin-off.</p>

<h3>See also</h3>
<p><a href="#kega">Kega</a> &middot; <a href="#kuga">Kūga</a> &middot; <a href="#kugaspin">KUGA (spin-off)</a></p>
` },

seals: { group:"The Mythology", title:"The Two Seals", crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"]],
stand:"The same ten gods sealed both halves. The first time they were certain. The second time they were already dead and kept going.",
body:`
<h2>The pantheon</h2>
<p>Kega sat at the head of a pantheon. <strong>Ten gods answered to him, each with their own village</strong>, a couple close enough to share one. He set the law, they kept it, and for a long time it worked and everybody knew why.</p>
<p>Then the Severing, and his law hardened with nothing left to correct it.</p>

<h2>The first seal, in arrogance</h2>
<p><strong>5,500 years ago.</strong> By this point everybody was on the same page and everybody was against him: he read as drunk on his own laws. They sealed him into the Book. They were united, certain, and sure it was for the best.</p>
<p><strong>For months it was.</strong> Then the problem nobody had thought about. His laws were the <strong>foundation</strong>, and with him gone there was no authority on which law was fit for purpose and which was not. Competing readings. Things lost in translation. Contradictions nobody could settle.</p>
<p>Then the slide. They stopped meeting at the secret place, or somebody did not turn up. Whispers. Deceptive accusations. <strong>Not seeing eye to eye spread like a virus.</strong> The gods who had sealed him together became, over centuries, deadly enemies, and their feud passed down into their villages, which became the clans.</p>
<blockquote>You don't know what you have done.
<span class="who">Kega, as they seal him. Quiet, not shouted.</span></blockquote>

<h2>The second seal, in humility</h2>
<p><strong>4,000 years ago.</strong> Kūga caught wind of the order failing and rose. By the time they faced him he was a terrifying force: if they had not worked together he would have consumed and destroyed everything.</p>
<p>It took real persuasion to get the hottest head to agree. They tried to seal him the normal way, in open battle, and it did not work. <strong>They only realised mid-fight that it was going to be a sacrifice seal.</strong> Ten gods understanding, live, that they are already dead, and continuing anyway.</p>
<p><strong>All ten died. The age of gods ended there.</strong> That is why the present day has Aura and no divine presence anywhere: there is nobody left. Kega survives only because he was already locked away when the bill came.</p>

${art("The sacrifice seal", "Ten figures mid-ritual, and the moment on their faces where they each understand what it is going to cost. The crystal forming between them. This is the single most important historical image in the series.")}

<div class="note"><span class="lab">The pair</span>
<p><strong>The first seal was done by beings who thought they knew better. The second by the same beings, once they had learned they did not.</strong> Kūga gets this line, with a chuckle, because it is genuinely funny to him: the gods who threw Kega away then had to die to contain the thing Kega threw away.</p></div>

<h2>What the record gets wrong</h2>
<div class="rvt">
<div class="r"><h4>The record</h4>
<p>It happened in ancient Japan.</p>
<p>Ten warriors: five highest Shinobi and five secret Ninja.</p>
<p>They came from rival clans who had been sworn enemies for generations.</p></div>
<div class="t"><h4>The truth</h4>
<p><strong>It was never Japan.</strong> The events predate Japan by thousands of years. Japan is where the story was recorded and where the Sphere was buried, so that is where history thinks it happened.</p>
<p><strong>They were gods.</strong> The shinobi who eventually wrote it down retro-fitted their own vocabulary onto beings who predated the word by millennia.</p>
<p><strong>The enmity is the consequence, not the starting condition.</strong> The ten were united once. The feud came after.</p></div>
</div>

<h3>See also</h3>
<p><a href="#timeline">The Timeline</a> &middot; <a href="#book">The Original Book of Ninja</a> &middot; <a href="#trace">Trace</a></p>
` },

timeline: { group:"The Mythology", title:"The Timeline", crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"]],
stand:"Six thousand years, four fixed points, and one ratio that explains everything about him.",
body:`
<div class="tw"><table>
<thead><tr><th>Years before present</th><th>Event</th></tr></thead>
<tbody>
<tr><td class="num">6,000</td><td><strong>The Severing.</strong> Kega amputates. Weak for months. Kūga wakes naked in the bushes: the village, the kindness, the raid, the slave chain.</td></tr>
<tr><td class="num">5,500</td><td><strong>The First Seal.</strong> The ten seal Kega into the Book, in arrogance. Relief for months, then the collapse.</td></tr>
<tr><td class="num">4,000</td><td><strong>The Second Seal.</strong> The ten seal Kūga into the Sphere, in humility. Sacrifice seal: all ten die. The age of gods ends.</td></tr>
<tr><td class="num">4,000 to 22</td><td>The Sphere buried, the buriers take their own lives, the location dies with them. Fragments survive in scattered texts. Bio Genetix tracks it, the keeper steals it, the chain moves it west.</td></tr>
<tr><td class="num">22</td><td>The Sphere reaches Danim City. Springvale contamination begins.</td></tr>
<tr><td class="num">0</td><td>Kevin, 13, swallows it.</td></tr>
</tbody></table></div>

<h2>The ratios that matter</h2>
<ul>
<li><strong>Kūga was free for 2,000 years and sealed for 4,000.</strong>[[1]] Twice as long in the seal as in the world, which is why the will of ten gods is still the dominant thing he has ever absorbed.</li>
<li><strong>Kega has been in the Book for 5,500 years.</strong> And has been right for 5,500 years.</li>
<li><strong>Kūga's 2,000 free years cover the entire rise of human civilisation.</strong> He did not watch history. He was passed through it.</li>
</ul>

<div class="note"><span class="lab">Free consequence</span>
<p><strong>The Book is older than writing.</strong> Human script begins roughly 5,200 years ago and the Book is 5,500 years old, so it is not set down in any human language. It is not encrypted. It is simply older than the concept of reading, which is why almost nobody can read the deep chapters and why Tribal being able to read one is significant.</p></div>

${art("The timeline plate", "A vertical 6,000-year spine for the physical book edition. Four marked events, enormous silence between them. Should feel like a page from something ancient rather than an infographic.")}

<h3>See also</h3>
<p><a href="#seals">The Two Seals</a> &middot; <a href="#springvale">Springvale</a> &middot; <a href="#book">The Original Book of Ninja</a></p>
` },

will: { group:"The Mythology", title:"The Power of Will", crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"]],
stand:"What Kevin genuinely wants, happens. Which is a much worse problem than it sounds.",
body:`
<h2>Where it comes from</h2>
<p>The prison walls are made of ten warriors' life force. So for over a thousand years the only input Kūga had was <strong>the will of ten beings who chose to die rather than let him out</strong>. He amplified that. Every day. For four thousand years.</p>
<p>The ten did not merely fail to kill him. <strong>They fed him, and what they fed him was the finest thing anyone has.</strong></p>
<p>And the gap that decides the ending: <strong>he learned will, and he never learned love.</strong> Conviction is not connection, and there was none of the second thing in that cell.</p>

<h2>The rule the audience learns once</h2>
<div class="note"><span class="lab">The whole system in one line</span>
<p><strong>Kūga does not answer requests. He answers declarations.</strong>[[1]]</p>
<p>"Help me" contains doubt, so it dies in the air. "I will not let this happen" contains none, so it detonates.</p></div>
<p>No matter how bad it gets, Kūga will not intervene for pain, fear or pleading. Only for a thing Kevin ultimately, definitely, without a shred of doubt wants otherwise, and genuinely believes.</p>

<h2>The asymmetry that is Kevin's whole arc</h2>
<p><strong>Harm is cheap. Good is expensive.</strong>[[1]]</p>
<p>Violence is Kūga's native register, so a destructive thought is already in a language he speaks perfectly and needs almost no signal. Constructive will is a foreign language he only ever met as ten beings holding a door shut, so Kevin has to be <strong>deafening</strong>, and any tremor of doubt and nothing happens at all.</p>
<p><strong>Evil is a whisper. Good is a scream.</strong> And Kevin is thirteen.</p>

<h3>The intrusive thought</h3>
<p>Kūga can grow his nails and mime a throat-cut on someone only Kevin can see him touching. If Kevin so much as <em>pictures</em> it, the throat opens in reality. Kūga smiles: the will was too weak to refuse the thought.</p>
<p>This is the elephant-in-a-bathroom problem weaponised, and it is genuinely unfair, which is the point. Kevin's real nightmare is not the monster. It is <strong>his own mind not being his to control</strong>.</p>

<h3>The test pattern</h3>
<p>He says <em>"I could just..."</em> to the ceiling. Bored, unserious, never looking at Kevin. Then the corner-of-the-eye check. Then, flat and cold:</p>
<blockquote>Oh. Interesting.
<span class="who">Two words that mean: I caught you.</span></blockquote>
<div class="note"><span class="lab">Writing rule</span>
<p><strong>Every one of Kūga's jokes is a live test.</strong> He is never only joking. This is why the comedy and the horror run off one engine instead of fighting each other, and why the audience learns to tense at his jokes before Kevin does.</p></div>

<h2>Two consequences for the writing</h2>
<p><strong>Training is subtractive.</strong> Most shonen training adds: learn more, get more. Kevin's first year is damage control. He has to learn to think <em>less</em> before he can learn to think one thing completely. Clearing the mind is survival, not decoration.</p>
<p><strong>There is no power creep, ever.</strong> Kevin never gets stronger and neither does Kūga. Neither number moves. The only variable is <strong>how much he can hold without being rewritten</strong>: a flicker in Season 1, a decision by Season 3. The ceiling was always infinite. The story is the boy widening.</p>

<h3>See also</h3>
<p><a href="#kuga">Kūga</a> &middot; <a href="#kevin">Kevin Young</a> &middot; <a href="#aura">Aura</a></p>
` },

book: { group:"The Mythology", title:"The Original Book of Ninja", crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"],["","To exist in real life"]],
stand:"Also the Book of Kega. It is a manual, and that is exactly why it is a prison. It has been in a school library for twenty years.",
body:`
<h2>Three names</h2>
<ul>
<li><strong>The Original Book of Ninja.</strong> The formal name, used by anyone who knows what it is.</li>
<li><strong>The Book of Kega.</strong> What it actually is, learned very late.</li>
<li><strong>"the Book."</strong> What everyone in Danim says.</li>
</ul>

<h2>A manual, and that is exactly why it is a prison</h2>
<p>He is the Original Ninja God, so <strong>the arts are his.</strong> The Book is that teaching written down: his complete works.</p>
<p><strong>You cannot imprison a god in a random object.</strong> You imprison him in the thing that is most completely him. The ten did not put Kega in a book. <strong>They put him in his own life's work</strong>, which is the only container that was ever going to hold him.[[2]]</p>
<p>So "his own laws are the bars" is literal. <strong>The teaching is the material the walls are made of.</strong></p>

<h2>The three depths</h2>
<p><strong>1. Forward: the teaching.</strong> The Book <strong>translates itself into the reader's own language</strong>. Generous, complete, and it wants to teach you. This is what the Mandem learned.</p>
<p><strong>2. Backward: the prohibition.</strong> Flip it and read the other way and <strong>it stops translating</strong>. Raw god-language. The forbidden layer, the Loyalty Elixir and the rest.</p>
<div class="note"><span class="lab">Why it stops</span>
<p><strong>The translation IS the permission.</strong> The Book renders what you are allowed to have and refuses to render what you are not. <strong>The language barrier is not a lock, it is a refusal</strong>, the Book telling you to stop in the only way a book can.</p>
<p>And the forbidden things are in there because <strong>a complete law must name what it forbids.</strong> Every law book contains the crimes.</p></div>
<p><strong>3. The page.</strong> Not a location, an <strong>event</strong>. It appears only when the forbidden ritual is performed, under the conditions of law, at the right moment in time. It is in the language of the gods and <strong>must be performed within a window</strong>. Performing it frees Kega.</p>

<h2>How the depths fit the seal</h2>
<p><strong>The right moment is a state, not a date.</strong> The moment is right when the seal has thinned enough, and what thins it is the violation list. <strong>So the whole cast set the clock:</strong> Sharon's intel, Bio Genetix, Jaden, a thirteen-year-old eating a sweet. Tribal did not choose the hour. The world did, and he happened to be standing there holding the right chapter.</p>
<p><strong>The conditions of law are Kega's own formalities.</strong> Which means <strong>the god of law can only be freed by someone obeying the rules perfectly</strong>, in order to commit the most forbidden act there is. Tribal did everything correctly. That is why it worked.</p>
<p><strong>The page is the receipt. The window is the mercy.</strong> The ritual plus conditions plus moment is the lock turning; the page appearing is the door already swinging. So <strong>Tribal had a window in which he could have stopped</strong>, and did not, because he read the page as the prize finally being handed to him. It was the last step of a release protocol and he thought it was a reward.</p>
<div class="note"><span class="lab">And the seal is maintained by correct practice</span>
<p>Every hour the arts are used as intended, the walls thicken. Every misuse thins them. Which means <strong>the Mandem, training the Three Pillars properly for years, were unknowingly the strongest part of the prison in four thousand years.</strong></p>
<p>Then Jaden read the same book and brewed the Elixir. He did not only betray his brothers. <strong>He was the seal, and he tore it from the inside, and he still does not know that is what he did.</strong></p></div>
<p><strong>The Book set no trap.</strong> It taught Tribal generously and completely for years, so he reasonably expected more of the same when he turned it over. It taught him to trust it, and then he flipped it. That is not malice. That is what a complete law looks like from underneath.</p>

<h2>The triangular order</h2>
<p><strong>Opening the Book is not the violation. Reading it is not the violation.</strong> The violation is a triangle, and it only becomes a problem when all three corners complete outside the law.</p>
<ol><li><strong>READ</strong></li><li><strong>UNDERSTOOD</strong></li><li><strong>ACTED UPON</strong></li></ol>
<p>Any one corner alone is harmless. A man can hold the Book open on his lap for a decade and nothing happens. The binding only loosens when reading becomes understanding becomes <strong>action</strong>, taken outside the law.</p>
<div class="tw"><table>
<thead><tr><th>Who</th><th>Read</th><th>Understood</th><th>Acted</th><th>Verdict</th></tr></thead>
<tbody>
<tr><td>The Mandem learning the Three Pillars</td><td>yes</td><td>yes</td><td>yes, <strong>within the law</strong></td><td>No damage.</td></tr>
<tr><td><strong>Jaden brewing the Loyalty Elixir</strong></td><td>yes</td><td>yes</td><td><strong>outside the law</strong></td><td><strong>Real damage.</strong></td></tr>
<tr><td>Bio Genetix, TANCs</td><td>partial</td><td>partial</td><td>outside the law</td><td>Damage, unknowingly.</td></tr>
<tr><td><strong>Tribal's chapter and ritual</strong></td><td>yes</td><td><strong>only he can</strong></td><td><strong>yes</strong></td><td><strong>The final crack.</strong></td></tr>
</tbody></table></div>
<div class="note"><span class="lab">What this makes Trace</span>
<p><strong>Not a guard on an object. The monitoring of a sequence.</strong> It does not care where the Book physically is or who is holding it. It steps in at the exact point where understanding turns into action outside the law, which is why Face can run the entire Danim underworld and never once trouble it, and why twenty years in a school library cost nothing.</p></div>

<h2>Older than reading</h2>
<p>It is 5,500 years old, and human script begins roughly 5,200 years ago. <strong>It is not set down in any human language.</strong> It is not encrypted, it is simply older than the concept of reading, which is why almost nobody can read the deep chapters.</p>
<p>Condition-revealed pages are already how it works: the Loyalty Elixir sits behind three riddles (Trust, Sacrifice, Memory) and a spoken phrase, and the chapter Tribal reads appears only once the terms are met and the time is right.</p>

<h2>Jaden found it</h2>
<p>All three of the Mandem read it in that detention sixteen years ago, but <strong>Jaden's hand touched it first</strong>[[1]]. He is also the one who later pulls the Loyalty Elixir out of it and uses it on his brothers.</p>
<p><strong>The finder becomes the betrayer.</strong></p>

${art("The Book", "The physical object as it sits in the Endsworth library: unremarkable, shelved, wrong. Then a second plate of an open deep chapter, in a script that predates writing and should not look like any real alphabet.")}

<div class="note"><span class="lab">Production, and it changes how we write</span>
<p>The Book is to exist in the real world as a <strong>limited physical run</strong>. So from now on, every new piece of lore gets drafted <strong>in the Book's voice, as a page</strong>, rather than as bible prose. Do that as we go and the physical edition assembles itself instead of needing a translation pass over four seasons of notes.</p></div>

<h3>See also</h3>
<p><a href="#kega">Kega</a> &middot; <a href="#trace">Trace</a> &middot; <a href="#tribal">Tribal</a></p>
` },

springvale: { group:"The Mythology", title:"Springvale", crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"]],
stand:"A cheap bottled water brand that folded twenty years ago, and the reason every ninja in Danim City exists.",
body:`
<h2>Two names</h2>
<ul>
<li><strong>SPRINGVALE.</strong> The brand. It was bottled and sold into schools, so it had a label. This is what Danim calls it. <em>"He's a Springvale kid." "You drank Springvale?"</em> It doubles as an age marker: if you are Springvale you are 27 to 37, and everybody knows it.</li>
<li><strong>濁り NIGORI.</strong> What the Book calls it. Cloudiness, turbidity, the impurity suspended in a liquid. Nobody ever connects the two.</li>
</ul>

<h2>Why water, and only water</h2>
<p>The seal is made of ten warriors' <strong>life force</strong>, and water is what life is mostly made of. It did not leak into the air, the soil or the stone. It leaked into the one substance in the building that resembled its own prison walls.</p>
<p><em>The purification rite for defilement by water is misogi. The medium of contamination and the medium of cleansing are the same substance. Nobody in the show ever says this.</em></p>

<h2>The two years</h2>
<p>The contamination ran <strong>22 to 20 years before present day. Two years exactly.</strong>[[1]]</p>
<p><strong>Why it stopped.</strong> The keeper hid the Sphere in the school water tank because it was the safest place he could think of: constantly moving, sealed, nobody looks in a school water tank. He did not know it would leak. Two years in he started noticing the children changing, understood what he had done, pulled the Sphere out and ran.</p>
<p>The man who saved the world is also the man who accidentally created every ninja in Danim City.</p>

<h2>The two bounds have two different causes</h2>
<p>Thousands of children aged 5 to 15 were exposed. Dormant potential unlocked; without training, powers stayed inactive.</p>
<ul>
<li><strong>The lower bound (5) is purely logistical.</strong> It was school water. The youngest children in a UK school are four or five. Nothing mystical about it.</li>
<li><strong>The upper bound (15 to 16) is the real law: Kūga can only enter what is not finished yet.</strong> An adult has a settled self and hardened pathways, and there is nothing there for a formless thing to take root in. A child is still forming, so the pathway is still open because the person is still open.</li>
</ul>
<p>Nobody in-world knows these are two different reasons. They just say "kids".</p>

<div class="note"><span class="lab">Why this makes the Ultimatum mechanical</span>
<p>"Master it by manhood or be consumed" stops being a poetic deadline. <strong>Kevin's window is closing because Kevin is finishing.</strong> When he is fully formed the shape sets, and either he set it or Kūga did.</p></div>

${art("Springvale bottle", "The label, exactly as naff and forgettable as a defunct early-2000s British school water brand should be. Needed as a recurring prop and as the single image that dates a whole generation of characters.")}

<h3>See also</h3>
<p><a href="#lineage">The Lineage Model</a> &middot; <a href="#timeline">The Timeline</a> &middot; <a href="#uno">Uno</a></p>
` },

lineage: { group:"The Mythology", title:"The Lineage Model", crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"]],
stand:"Every ninja made by the water is now 27 to 37. One cohort. So the second generation can only get in through blood.",
body:`
<h2>The consequence nobody planned</h2>
<p>The contamination ran two years and took children aged 5 to 15. Do the arithmetic and <strong>every ninja made by the water is now between 27 and 37 years old</strong>. One cohort, a single band, nobody older and nobody younger.</p>
<p>Danim City's entire ninja population is one year group that drank the same water.</p>

<h2>So the kids are all somebody's kids</h2>
<p><strong>Every second-generation ninja is the child of a water-generation ninja.</strong> Donte (Face and Hella). Kevin (the Young line; Jaden is Tier 4 gold). Uno is artificial. Tribal is outside the system entirely.</p>
<p><strong>Scale to hold to:</strong> a few dozen kids in Danim with the potential, of whom only a handful have actually woken up, because activation still needs the trigger. Enough for rival crews, a school thread and recruitment arcs. Never enough to break the Ninja Code.</p>

<h2>What it buys, and what was rejected</h2>
<p><strong>Every young character arrives with an adult attached.</strong> A parent, a secret, or an absence. "Whose kid are you?" becomes the most loaded question in the series, which is already Donte's entire arc.</p>
<div class="tw"><table>
<thead><tr><th>Model</th><th>Verdict</th></tr></thead>
<tbody>
<tr><td>My Hero Academia (powers common, society reorganised)</td><td><strong>Rejected.</strong> The moment there are enough kids for a school, the Ninja Code is dead and a locked pillar goes with it.</td></tr>
<tr><td>Miles Morales (two or three peers, everyone else adult)</td><td><strong>Rejected.</strong> Makes Danim feel small and leaves nowhere to grow.</td></tr>
<tr><td>Lineage</td><td><strong>Locked.</strong> Rare but not unique, and every kid comes with a family problem attached.</td></tr>
</tbody></table></div>

<div class="note"><span class="lab">The free ticking clock</span>
<p>One cohort had their children at roughly the same time, so the second generation is hitting the activation window <strong>simultaneously. Right now.</strong> A wave is cresting in Danim City, which is why the story happens this year and not any other, and why Bio Genetix, Face and Sharon are all about to notice the same thing from three different directions.</p></div>

<h3>See also</h3>
<p><a href="#springvale">Springvale</a> &middot; <a href="#kevin">Kevin Young</a></p>
` },

trace: { group:"The Mythology", title:"Trace", crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"],["open","Some open"]],
stand:"Not born, not created. It is a reason. And it plays football in a cage in Danim, and nobody thinks that is strange.",
body:`
<h2>It is a reason</h2>
<p>Trace was not born and was not created. <strong>It is a reason</strong>, which is why it is not solid and why its appearance is closer to a conceptual outline than a body.</p>
<p>When the gods died in the Second Seal they knew the Book would outlive them, and Trace is the provision they made. Not a guard they appointed. <strong>The reason the Book stays shut</strong>, given a shape.</p>
<p><em>Use "it", never "he". The writing must never quietly promote it to a person.</em></p>

<h2>The illusion</h2>
<p><strong>Nobody sees Trace as a ghost. Nobody questions its appearance.</strong> To them it does not feel abnormal.</p>
<p><strong>Because a reason arrives already accepted.</strong> That is what a reason is. You do not interrogate why a reason is present, so humanity files Trace as just another person and moves on. Their minds supply the person. Trace supplies nothing.</p>
<div class="note"><span class="lab">Audience device</span>
<p>The audience will notice long before any character does, and will spend episodes asking why nobody is freaking out at the shadowy human-shaped thing standing right there. <strong>That question is not a bug to patch. It is the reveal.</strong> Do not have a character voice it early to relieve the tension.</p></div>

<h3>Tribal is the only one who sees it as it is</h3>
<p>And it is the same rule as everything else about him. The acceptance is a property of the gods' order, and Tribal sits outside that order, so he gets no auto-fill. <strong>He sees the raw thing.</strong></p>
<p>One rule, three consequences: Trace has no authority over him, Kega has no jurisdiction over him, and <strong>the illusion does not reach him.</strong></p>
<p><strong>He was frightened of it for a very long time</strong>, which is correct. He is the only person alive looking at it without the comfort of the lie.</p>

<h2>It knows exactly what it is</h2>
<p><strong>Trace knows precisely what it is and why it exists.</strong>[[1]] It is not confused, not searching, not waiting to find out. It has known for four thousand years.</p>
<p><strong>Nobody has ever asked it the right questions.</strong></p>
<p>The information has been standing in a park in daylight for four millennia, entirely available, and every person who could have understood the answer never saw anything worth asking about, while the one person who does see it cannot parse the reply.</p>
<blockquote>The information is available to everyone and reachable by nobody.<span class="who">The double lock</span></blockquote>

<h2>The football: the one thing it does not know</h2>
<p><strong>It knows everything about itself except this.</strong> It has a strange attraction to football and it does not know why either. You will almost always find it in the park or the cage playing. Kids play around it and with it. Nobody thinks it is odd.</p>
<p><strong>And it has a fetish for the scores.</strong> It wants results. It will ask, and because everyone accepts it as an ordinary person, they simply tell it. A bloke on a bench gets asked the score by a hole in the world and answers without looking up.</p>
<div class="note"><span class="lab">Writing rule</span>
<p><strong>Never explain the football. Ever. Not even Trace can.</strong> It works because there is no reason for it, and the fact that a thing with perfect self-knowledge has exactly one gap in it, and the gap is football, is the closest thing it has to a soul.</p></div>

${art("Trace in the cage", "Daylight, a Danim park cage, kids mid-game, and one player who is a hole in the world. Nobody in frame is reacting. This is how the audience should meet Trace, long before anyone says what it is.")}

<h2>Appearance</h2>
<p><strong>Body type: a university athlete.</strong> Clearly not an adult, clearly not a child, past teenage. Lean, capable, unremarkable.</p>
<p><strong>Colour: pure, absolute black</strong>, free of any colour undertone. The reference is a display state where the pixels are switched off entirely and emit zero light, not a dark grey and not a blue-black.</p>
<p><strong>The white highlights are the only detail.</strong> A subtle tip of white catching an edge, just enough to read as three-dimensional rather than a flat cut-out. Enough that you think you can almost see lips, and cannot.</p>
<div class="note"><span class="lab">The distinction that makes the design hard</span>
<p><strong>Trace is not a silhouette.</strong> A silhouette is a person with light behind them, and the viewer's brain resolves it into a person hidden by contrast. Trace is the opposite: <strong>a shape with nothing inside it and nothing casting it.</strong> There is no source. It is not in shadow. It is the absence, standing in full daylight.</p></div>

<h3>Image spec</h3>
<p><strong>Keep:</strong> the void figure against a fully lit park; <strong>background people not reacting</strong> (the illusion made visible, and every Trace image should carry it); ball at the feet; no face; athlete proportions; a thin rim highlight on shoulder and forearm.</p>
<p><strong>Three fixes:</strong></p>
<ol>
<li><strong>No surface gloss.</strong> Broad sheens across chest and thighs read as a reflective material, latex or vinyl, and a surface that reflects light is the opposite of one that emits none. Thin <strong>edge</strong> rim only; the interior stays flatly dead.</li>
<li><strong>Less anatomy.</strong> Pecs, abdominal contour, knee definition and separate fingers all resolve it into a body. Merge the fingers, drop the interior modelling, let the outline carry the form.</li>
<li><strong>Dress it in the void.</strong> Canon rather than taste: the illusion needs it to read as an ordinary lad who came down for a kickabout, and a naked figure is exactly what people <em>would</em> react to. T-shirt, shorts, trainers, all in the same absolute black.</li>
</ol>

<h2>Voice</h2>
<p><strong>No mouth. No voice box.</strong> You do not hear it with your ears. It puts the words into your thoughts, and because there is no mouth to watch, both the character and the audience experience it as speech.</p>
<p><strong>Sound design rule: thought-speech has no room acoustic.</strong> No reverb, no space, no falloff with distance. It is exactly as present whether Trace is beside you or across the pitch. Nobody in-world ever comments on it and the audience feels it every time.</p>

<h3>Two channels</h3>
<p><strong>Trace speaks the language of the gods.</strong> To a normal person the thought-speech arrives already comprehensible. To Tribal, who is outside the order, it arrives raw: slurred, reversed, unmistakably a real language and completely opaque.</p>
<p><strong>Proposed device:</strong> the audience hears whichever channel Tribal hears. In a scene with both a normal character and Tribal present, we hear the raw god-language while the normal character answers as though it made perfect sense. The audience works out there are two channels before anybody explains it.</p>

<h3>Does Tribal ever understand?</h3>
<p><strong>Recommendation: he never learns the language. He learns what the language IS.</strong></p>
<p>Over years he learns to recognise a few sounds by what tends to follow them, the way you learn a dog's bark. Function without meaning.</p>
<p>Then the payoff. <strong>Kega speaks the same language.</strong> When Kega arrives in Season 4 and opens his mouth, Tribal understands nothing and recognises the <em>sound</em>. Forty years of hearing that language out of a shadow that plays football, and now it is coming out of a god.</p>
<p>He never gets the words. He gets the category.</p>

<h2>Engagement rule</h2>
<p><strong>Trace only steps into incidents that go against the laws of the Book</strong>, and it escalates with how badly the Book's secrets are being abused.</p>
<p>It has no opinion about crime, violence, ninjas or Danim City. Face can run the entire underworld and Trace will keep playing football. <strong>The Book is the only thing it is for.</strong> It never initiates.</p>

<h2>The one fight: Face</h2>
<p>Face told it to stand aside, like a little worm. It did not move.</p>
<p>He attacked, not at full power, just to frighten it. Dodged. Again. Dodged. Faster, then more ferocious, because the thing was making a mockery of him. He pushed into a final Aura state and threw everything he had. <strong>Trace dodged, blocked, and when the smoke cleared was standing at a distance.</strong></p>
<p>Then it closed the whole gap in an instant and set what appears to be a <strong>one-inch punch</strong> against his stomach. The zoom stops dead for one split second. Face looks down at the hand already resting on him. His startle plays in slow motion.</p>
<p>Then the punch. A thud inside his stomach and a burst of force around them both: <strong>no colour, just force.</strong> He goes down slowly, his vision blurs, he watches Trace walk away, and he passes out.</p>
<p>Jaden and Jon found him and asked what happened. <strong>His pride would not let him say it, and he has never told anyone he lost.</strong></p>

<div class="note"><span class="lab">Why the one-inch punch is the right technique</span>
<p>Zero wind-up, no travel, pure transfer. For a thing that <em>is</em> a reason that is exactly correct: no escalation, no build, just consequence arriving. <strong>Trace does not fight. It concludes.</strong></p></div>

<h3>And the fix that makes it better</h3>
<p><strong>Trace was not there for Face.</strong> Its engagement rule is the Book, and Face was not touching the Book. It was there for something else entirely, and <strong>Face walked into it and started a fight over a misunderstanding he will never learn about</strong>, because he never told anybody it happened.</p>
<p>He has spent years believing he lost a fight he picked over nothing. He is right. He just does not know what he interrupted.</p>
<p><strong>And it gives Face two secrets:</strong> one that was taken from him by the Elixir, and one he chose to keep. That pairs with the wrist tell as a second silent thing running under every scene he is in.</p>

<h2>Sensory signature</h2>
<div class="tw"><table>
<thead><tr><th>Source</th><th>Register</th></tr></thead>
<tbody>
<tr><td><strong>Aura</strong></td><td>Hot, light, crackle. Fills a room.</td></tr>
<tr><td><strong>Voodoo</strong></td><td>Cold, void, heavy silence. Empties a room.</td></tr>
<tr><td><strong>Trace</strong></td><td><strong>No temperature, no colour, pure force.</strong> Neither fills nor empties. It simply arrives.</td></tr>
</tbody></table></div>

<h2>What happens when the seal breaks</h2>
<p><strong>It does not die. It becomes unnecessary</strong>[[1]], which is a different and worse thing.</p>
<p>It is the reason the triangle stays broken. When Tribal completes it, the reason becomes the reason for nothing, and <strong>unnecessary things do not end, they stop having been needed.</strong> So it fades, and there is a window.</p>
<p><strong>And nobody notices, because the acceptance was part of the order too.</strong> Everyone who ever saw an ordinary lad loses that lad. It is not a death anybody mourns. As far as the world is concerned there simply was never anyone there.</p>
<p><strong>Except Tribal.</strong> He was outside the order, so he is the only person who ever saw it truly and the only one who will remember it existed. He is also <strong>the man who broke the seal.</strong> He kills the only thing that ever let him look at something honestly, and he can never tell a living soul, because nobody else knows there was anything to lose.</p>
<h3>The window</h3>
<p><strong>For the first time in four thousand years it is not for anything.</strong> So it goes to the cage.</p>
<p>The last image of Trace is it playing football, getting less and less there, while nobody in the park notices a player going missing. Tribal on the fence, the only one who can see it.</p>
<p><strong>And the last thing it ever does is not language.</strong> Tribal asks it again what it is. He still cannot understand the answer, because he never could.</p>
<blockquote>So Trace passes him the ball.<span class="who">The end of it</span></blockquote>
<p><em>Leave it deliberately unclear whether Trace knows it is ending. Tribal cannot tell. He never could.</em></p>

<h2>What Kevin sees</h2>
<p><strong>Not the truth, and not the lie. A mismatch.</strong></p>
<p>Kevin is inside the order. <strong>Kūga is not.</strong> So his eyes accept the ordinary lad like everyone else's do, while <strong>something inside him flatly refuses</strong>, and he cannot reconcile the two or locate where the wrongness is coming from. Correct experience for a boy whose whole arc is his own mind not being entirely his own.</p>
<p><strong>Kūga knows exactly what it is and will not tell him.</strong> <em>"You should look at that again."</em> Bored, looking elsewhere, never explains twice.</p>
<h3>And the reverse, which is bigger</h3>
<p>Trace is the last surviving element of the operation that sealed Kūga, and Kevin is carrying Kūga. But <strong>Kevin is masked by default</strong>, because an amplifier at rest emits nothing.</p>
<p>So Trace does not notice him. Not for episodes. <strong>Not until the first time Kevin uses the power anywhere near it.</strong></p>
<p>Mid-game. The ball rolls past. <strong>Trace does not follow the ball.</strong></p>
<p>Its rule is the triangle, not the Sphere, so <strong>it does not act. It just notices.</strong> Which is much worse, and it costs one shot.</p>

<h3>Open</h3>
<ul>
<li>Whether Tribal ever understands the language.</li>
<li>Has it ever intervened before, in four thousand years? If so there are incidents in the record nobody could explain.</li>
<li>Does it know what it is? Distinct from whether it can say.</li>
<li>Does it know it is ending? Deliberately unresolved on screen.</li>
<li>Whether the football ever meant anything. <strong>The answer must never reach the audience either way.</strong></li>
</ul>

<h3>See also</h3>
<p><a href="#seals">The Two Seals</a> &middot; <a href="#book">The Original Book of Ninja</a> &middot; <a href="#tribal">Tribal</a> &middot; <a href="#voodoo">Voodoo</a></p>
` },

voodoo: { group:"The Mythology", title:"Voodoo", crumb:"Mythology",
chips:[["locked","Locked 2026-08-10"]],
stand:"The one power in the series that has nothing to do with either god, because they only ever legislated for the living.",
body:`
<h2>Everything else descends from two gods</h2>
<p>Aura is Kūga's leak. The Book is Kega's prison. Trace is the Second Seal's provision. TANCs are Bio Genetix failing to copy Aura. Uno is Springvale plus a doctor's blood.</p>
<p><strong>Voodoo is the single exception, and there is a reason rather than a hand-wave.</strong></p>

<h2>Every voodoo ability is death-side</h2>
<p>Resurrection, phantoms, spirit manipulation, soul binding, soul capture, life drain. <strong>Not one of them touches a living system.</strong></p>
<p>And the gods only ever legislated for the <strong>living</strong>. Kega set the order of life. Kūga amplifies the living. Aura is life energy in living bodies. The Book is the law of the living.</p>
<div class="note"><span class="lab">The rule</span>
<p><strong>Voodoo is the door the gods never legislated, because they never legislated for the dead.</strong>[[1]]</p></div>

<h3>The sensory rule</h3>
<p>Aura is heat, light and crackle in a living body. Voodoo is the exact inverse: <strong>cold instead of hot, void instead of light, heavy silence instead of energy.</strong> Where Aura fills a room, voodoo empties it. Never describe voodoo with Aura's vocabulary.</p>

<h2>Its source is mundane on purpose</h2>
<p>Sera found the degraded remains of something real, in books, in Danim, while looking for a love spell. Nothing divine gave it to her. <strong>Anyone could have found it.</strong></p>
<p>The mythology is six thousand years old, and the thing that eventually cracks it is a nineteen-year-old girl who was ignored.</p>

<h2>What being outside the order buys you</h2>
<p>Two beings are outside it: <strong>Kūga</strong>, the half that was cast out of the ledger, and <strong>Tribal</strong>, the man who was never in it.</p>
<ul>
<li><strong>Trace has no authority over Tribal.</strong> The Second Seal is a covenant among the living.</li>
<li><strong>Kega has no jurisdiction over him.</strong> Which is why a god of judgment stops to ask a human a calm question instead of purging him: Tribal is the first being in six thousand years he has no verdict for. He is not in the ledger.</li>
</ul>

<h3>See also</h3>
<p><a href="#tribal">Tribal</a> &middot; <a href="#sera">Sera</a> &middot; <a href="#aura">Aura</a></p>
` },

aura: { group:"The Mythology", title:"Aura", crumb:"Mythology",
chips:[["locked","Locked"]],
stand:"The main power system. Everyone has it. Almost nobody wakes it.",
body:`
<h2>The three pillars</h2>
<ul>
<li><strong>Mind.</strong> Mental discipline and focus. Telekinesis, memory alteration, illusion. Face's blade telekinesis and Manic's memory work.</li>
<li><strong>Body.</strong> Physical training past human limits. Strength, speed, reflexes. Jon's blade precision.</li>
<li><strong>Spirit.</strong> Inner energy, elemental control, pure projection. Eve's shadow snakes, Donte's fire.</li>
</ul>
<p>Balance or the powers turn on you. Overreliance on one pillar leads to instability.</p>

<h2>The five tiers</h2>
<div class="tw"><table>
<thead><tr><th>Tier</th><th>What it looks like</th><th>Who</th></tr></thead>
<tbody>
<tr><td><strong>1 Dormant</strong></td><td>Untapped. No visibility, no sensing.</td><td>Kevin at series start</td></tr>
<tr><td><strong>2 Awakened</strong></td><td>Faster, stronger, sharper than any human. Trained ninjas can sense each other.</td><td>Face's rank and file</td></tr>
<tr><td><strong>3 Channelled</strong></td><td>Aura pushed into body or weapons. Heat distortion, faint shimmer.</td><td>Hella, Eve</td></tr>
<tr><td><strong>4 Radiant</strong></td><td>Fully visible coloured aura. Face's black smoke, Jon's blue, Jaden's gold.</td><td>The Mandem in their prime</td></tr>
<tr><td><strong>5 Transcendent</strong></td><td>Near god-tier. The sky darkens, the ground cracks.</td><td>Reached through extreme emotional connection, or by carrying the Sphere</td></tr>
</tbody></table></div>

<h2>The growth ladder</h2>
<p>Where a ninja sits on this is the real measure of them, and it is how the series makes scale legible without ever printing a power level.</p>
<ul>
<li><strong>Ordinary ninjas grow by addition.</strong> Train, add a bit.</li>
<li><strong>The elite grow by multiplication.</strong> Each gain compounds the last.</li>
<li><strong>The Mandem grow exponentially.</strong> They had the water <em>and</em> the Book, and the Book is what turns multiplication into an exponent.</li>
<li><strong>Kūga is a different operation entirely: tetration.</strong></li>
</ul>
<p><em>Nobody in-world says these words. It is the shape the writing holds to.</em></p>

<h3>Cast colour map</h3>
<p>Jaden gold, Jon blue, Face black. Kevin gold and white, Donte black and white, Uno green and white. <strong>Black is Kevin's anti-colour, reserved for Hakai</strong>, and black-with-gold-highlights is his corruption-state tell.</p>

<h3>See also</h3>
<p><a href="#will">The Power of Will</a> &middot; <a href="#voodoo">Voodoo</a> &middot; <a href="#springvale">Springvale</a></p>
` },
