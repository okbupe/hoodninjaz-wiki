<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Danim Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f4f2;
    --card: #ffffff;
    --text: #17181a;
    --muted: #5b5f66;
    --border: #d8d6d2;
    --accent: #1f6f5c;
    --accent-text: #ffffff;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121314;
      --card: #1b1c1e;
      --text: #f1f0ee;
      --muted: #a3a7ad;
      --border: #313336;
      --accent: #4fb59a;
      --accent-text: #0b0f0d;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
  }
  h1 {
    font-family: "Cal Sans", "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 20px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    margin-bottom: 16px;
  }
  input[type="password"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .remember input { margin: 0; }
  .remember label { margin: 0; font-size: 0.9rem; }
  button {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    font-weight: 500;
    font-family: inherit;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
  .error {
    color: var(--error);
    font-size: 0.85rem;
    margin-top: 12px;
    min-height: 1.2em;
    text-align: center;
  }
  .forget {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .forget a { color: inherit; }
  .forget[hidden] { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>The Danim Codex</h1>
  <form id="gate-form" autocomplete="off">
    <label for="passphrase">Passphrase</label>
    <input type="password" id="passphrase" name="passphrase" autocomplete="off" autofocus>
    <div class="remember">
      <input type="checkbox" id="remember" checked>
      <label for="remember">Remember this device</label>
    </div>
    <button type="submit" id="open-btn">Open</button>
    <div class="error" id="error-line" role="alert"></div>
  </form>
  <span class="forget" id="forget-wrap" hidden><a href="#" id="forget-link">Forget this device</a></span>
</div>

<script>
(function () {
  var STORAGE_KEY = "wikilock:the-danim-codex";
  var payloadData = JSON.parse(document.getElementById("wiki-payload").textContent);

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function bytesToB64(bytes) {
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  var salt = b64ToBytes(payloadData.salt);
  var iv = b64ToBytes(payloadData.iv);
  var ciphertext = b64ToBytes(payloadData.payload);
  var iterations = payloadData.iterations;

  function openDocument(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function showError(msg) {
    var line = document.getElementById("error-line");
    if (line) line.textContent = msg;
  }

  function setBusy(busy) {
    var btn = document.getElementById("open-btn");
    if (btn) btn.disabled = busy;
  }

  function decryptWithKey(cryptoKey) {
    return window.crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      cryptoKey,
      ciphertext
    ).then(function (decrypted) {
      return new TextDecoder().decode(decrypted);
    });
  }

  function deriveKeyFromPassphrase(passphrase) {
    var enc = new TextEncoder();
    return window.crypto.subtle.importKey(
      "raw",
      enc.encode(passphrase),
      { name: "PBKDF2" },
      false,
      ["deriveKey", "deriveBits"]
    ).then(function (baseKey) {
      return window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: iterations, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        true,
        ["decrypt"]
      );
    });
  }

  function importRawKey(rawKeyBytes) {
    return window.crypto.subtle.importKey(
      "raw",
      rawKeyBytes,
      { name: "AES-GCM" },
      false,
      ["decrypt"]
    );
  }

  function tryStoredKey() {
    var stored;
    try {
      stored = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      stored = null;
    }
    if (!stored) return;
    var rawKeyBytes;
    try {
      rawKeyBytes = b64ToBytes(stored);
    } catch (e) {
      return;
    }
    importRawKey(rawKeyBytes).then(function (cryptoKey) {
      return decryptWithKey(cryptoKey);
    }).then(function (html) {
      openDocument(html);
    }).catch(function () {
      var wrap = document.getElementById("forget-wrap");
      if (wrap) wrap.hidden = false;
    });
  }

  function rememberKey(cryptoKey) {
    window.crypto.subtle.exportKey("raw", cryptoKey).then(function (rawKey) {
      try {
        localStorage.setItem(STORAGE_KEY, bytesToB64(new Uint8Array(rawKey)));
      } catch (e) {
        /* storage unavailable, fail silently, the gate still worked this time */
      }
    });
  }

  var form = document.getElementById("gate-form");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var input = document.getElementById("passphrase");
    var remember = document.getElementById("remember");
    var passphrase = input.value;
    if (!passphrase) return;
    showError("");
    setBusy(true);
    deriveKeyFromPassphrase(passphrase).then(function (cryptoKey) {
      return decryptWithKey(cryptoKey).then(function (html) {
        if (remember && remember.checked) rememberKey(cryptoKey);
        openDocument(html);
      });
    }).catch(function () {
      setBusy(false);
      showError("Wrong passphrase. Try again.");
      input.value = "";
      input.focus();
    });
  });

  // Enter in the passphrase field submits the form even where implicit submission is not wired.
  var passInput = document.getElementById("passphrase");
  if (passInput) {
    passInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        if (typeof form.requestSubmit === "function") form.requestSubmit();
        else form.dispatchEvent(new Event("submit", { cancelable: true }));
      }
    });
  }

  var forgetLink = document.getElementById("forget-link");
  if (forgetLink) {
    forgetLink.addEventListener("click", function (event) {
      event.preventDefault();
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      var wrap = document.getElementById("forget-wrap");
      if (wrap) wrap.hidden = true;
      showError("Forgotten. Enter the passphrase to open again.");
    });
  }

  try {
    if (localStorage.getItem(STORAGE_KEY)) {
      var wrap0 = document.getElementById("forget-wrap");
      if (wrap0) wrap0.hidden = false;
    }
  } catch (e) {}

  tryStoredKey();
})();
</script>
